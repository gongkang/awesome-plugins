[project]
name = "screen-control"
version = "0.1.0"
description = "智能屏幕控制技能 - 录屏时序帧感知 + 语义理解"
requires-python = ">=3.10"

dependencies = [
    # 屏幕截图
    "mss>=9.0.0",
    # 图像处理
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    # 鼠标键盘控制
    "pyautogui>=0.9.54",
    "pyperclip>=1.8.0",
    # 数值计算
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"